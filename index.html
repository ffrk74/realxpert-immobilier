<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RealXpert</title>
<script>
  // Page d'accueil : chaque visiteur arrive sur l'accueil RealXpert dans sa langue
  // (français par défaut ; allemand, anglais, italien selon le navigateur).
  (function () {
    var langue = ((navigator.languages && navigator.languages[0]) || navigator.language || 'fr').slice(0, 2).toLowerCase();
    var page = { de: '/de', en: '/en', it: '/it' }[langue] || '/fr';
    location.replace(page + location.hash);
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=/fr"></noscript>
</head>
<body></body>
</html>
